name: "Shared: release-publish"
on:
    workflow_call:
        inputs:
            tag_name:
                description: 'Release tag name to publish from'
                required: true
                type: string
            new_version:
                description: 'Calculated release version'
                required: true
                type: string

jobs:
    release:
        name: "CI: publish"
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.tag_name }}
                    fetch-depth: 1

            -   name: Publish Release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ inputs.tag_name }}
                    name: Release ${{ inputs.new_version }}
                    generate_release_notes: true
                    prerelease: ${{ contains(inputs.new_version, 'preview') }}
