name: "Shared: testing"
on:
    workflow_call:
        inputs:
            run_python_tests:
                description: 'Run Python unit tests'
                type: boolean
                default: true
            run_action_tests:
                description: 'Run action integration tests'
                type: boolean
                default: true

jobs:
    python-tests:
        name: "CI: python"
        if: ${{ inputs.run_python_tests }}
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.x'

            -   name: Install dependencies
                run: pip install pytest

            -   name: Run tests
                run: pytest tests/ -v

    action-test-version:
        name: "CI: action/version/${{ matrix.bump }}"
        if: ${{ inputs.run_action_tests }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   bump: major
                        expected_old: "0.1.0"
                        expected_new: "1.0.0"
                        expected_tag: "v1.0.0"
                    -   bump: minor
                        expected_old: "0.1.0"
                        expected_new: "0.2.0"
                        expected_tag: "v0.2.0"
                    -   bump: patch
                        expected_old: "0.1.0"
                        expected_new: "0.1.1"
                        expected_tag: "v0.1.1"
                    -   bump: custom
                        expected_old: "0.1.0"
                        expected_new: "2.0.0"
                        expected_tag: "v2.0.0"
                        custom_version: "2.0.0"
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Create test VERSION file
                run: echo "0.1.0" > VERSION

            -   name: Test action
                id: bump
                uses: ./
                with:
                    version_file: VERSION
                    bump: ${{ matrix.bump }}
                    custom_version: ${{ matrix.custom_version || '' }}

            -   name: Verify output
                run: |
                    [ "${{ steps.bump.outputs.version }}" = "${{ matrix.expected_new }}" ] || exit 1
                    [ "${{ steps.bump.outputs.old_version }}" = "${{ matrix.expected_old }}" ] || exit 1
                    [ "${{ steps.bump.outputs.tag }}" = "${{ matrix.expected_tag }}" ] || exit 1

    action-test-xml:
        name: "CI: action/xml/${{ matrix.bump }}"
        if: ${{ inputs.run_action_tests }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   bump: major
                        expected_new: "2.0.0"
                    -   bump: minor
                        expected_new: "1.1.0"
                    -   bump: patch
                        expected_new: "1.0.1"
                    -   bump: custom
                        expected_new: "3.0.0"
                        custom_version: "3.0.0"
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            -   name: Create test XML file
                run: |
                    cat > Directory.Build.props << 'EOF'
                    <?xml version="1.0" encoding="utf-8"?>
                    <Project>
                      <PropertyGroup><Version>1.0.0</Version></PropertyGroup>
                    </Project>
                    EOF

            -   name: Test action
                id: bump
                uses: ./
                with:
                    version_file: Directory.Build.props
                    bump: ${{ matrix.bump }}
                    version_element: .//Version
                    custom_version: ${{ matrix.custom_version || '' }}

            -   name: Verify output
                run: |
                    [ "${{ steps.bump.outputs.version }}" = "${{ matrix.expected_new }}" ] || exit 1
                    [ "${{ steps.bump.outputs.old_version }}" = "1.0.0" ] || exit 1
                    [ "${{ steps.bump.outputs.tag }}" = "v${{ matrix.expected_new }}" ] || exit 1
